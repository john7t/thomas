-015","11-26","按鈕處理中原本顯示「…」的，改成轉圈圖示（傳綁定連結、解除、包廂更新等）。"],["ns-014","11-26","師傅綁定連結改用 LINE 卡片傳（師傅照片＋「綁定我的 LINE」按鈕），看不到網址。"],["ns-013","11-26","老闆頁精簡：拿掉「支」（改顯示服務時數；師傅費用設定改成「每 30 分鐘師傅費用」）；請假只剩事假、病假；日報、月報拿掉上下牌準時、客滿沒接到；上期／下期改成上半月／下半月；設定拿掉天災假、主櫃系統（只留腳位、床位、清潔時間）、主櫃規則、老點 LINE 通知；價目表拿掉算幾支、IG 打卡折價券、員工按摩、平日限定、五六日活動；額外品項拿掉算幾支；所有「讀取中」等文字加轉圈圖示；包廂使用情形讀過的日期存本機，切頁回來直接顯示。"],["ns-012","11-26","讀取加速：預約清單、包廂、查時段、會員中心不用排隊、同時送；GAS 同一次只開一次試算表、設定只讀一次，同一天的預約與師傅資料快取 60 秒；畫面顯示每次讀取花幾秒（測試用）。"],["ns-011","11-26","預約項目加「其他」（單做刮痧、拔罐、耳燭，大照片、可複選）；包廂使用情形固定顯示 9～24 點；預約頁不列 #28、#29。"],["ns-010","11-25","預約項目分兩層（指壓／油壓再選手法）；刮痧、拔罐、耳燭放同一張照片卡；選師傅先列出全部師傅；新增「包廂使用情形」（老闆頁預約、師傅頁）。"],["ns-009","11-25","既有師傅綁定 LINE：老闆頁「人員 → 師傅」傳一次性綁定連結，師傅點開確認就綁好；可解除綁定。"],["ns-008","11-25","第二次打開先用本機資料直接進畫面（開通名單、牌況、預約清單），背景再更新；選師傅按鈕加頭像，點頭像看整張卡片。"],["ns-007","11-25","預約頁項目照片（指壓／油壓、熱蠟、刮痧拔罐）；LINE 預約通知帶項目照片。"],["ns-006","11-25","老闆頁「預約」改成歷程：時間放前面，一行一件事（客人送出、派單、師傅回覆可接單／不接、晚一步已告知、預約成立、客人已收到、取消）。分享給師傅也會記一筆派單；分享卡片不顯示指定和價格。"],["ns-005","11-25","師傅接單頁多「我不接此單」；接單頁和推播、分享卡片不再顯示客人選了哪些師傅、價格、優惠。晚一步才按接單的師傅會看到「此單已有其他師傅提前確定接單」。老闆頁「預約」：師傅接單時間、誰不接、誰晚一步按接單；客人是否已按「確認預約」和時間。成立通知給客人的按鈕改成「確認預約」，會員中心的預約也有確認按鈕。"],["ns-004","11-25","接單制：客人線上預約一律等師傅接單才成立（可以多選想要的師傅，或不指定）；客人可以設定不想被安排的師傅。老闆頁新增「預約」分頁：等接單的預約可以按「系統推播詢問」（推播給可以接的師傅）或「分享給師傅」（用老闆自己的 LINE 分享接單卡片），也可以直接指派或取消；接下來的預約一覽。師傅點卡片打開接單頁，先按先接，接到後系統通知客人和老闆。設定可以改等接單分鐘（預設 60，沒人接自動取消）、送出後是否自動推播。"],["ns-003","11-25","看師傅：老闆、管理者的身分選單「師傅頁」（看自己）和「看師傅」（選別人、只能看）分開。客人預約：項目改成指壓／油壓 120、90 分（可加時 30、60 分）、腳底 60、90 分、熱蠟 A／C 套餐（可加購 B 部位）、熱蠟 B 單項；加購刮痧、拔罐、耳燭；優惠擇一（貴賓活動日、早鳥、不指定、社群打卡、當月壽星、壽星同行友人、兩人同行、壽星熱蠟 A），不符合條件的灰掉並說明原因；每位顯示價格和時間，多位顯示合計；指定師傅顯示編號，師傅設定名稱後顯示名稱。"],["ns-002","11-25","拿掉主櫃（入口、公務機、登入碼）；老闆、管理者可以選一位師傅看師傅頁（只能看）；師傅頁拿掉上牌打卡、排班規則、牌況；「老師」全部改稱「師傅」。"],["ns-001","11-25","THOMAS.鑫紓壓會館初版（以範例 v0.1-209 為底）：店名、LIFF、官方帳號、地址、營業時間 09:00～23:00；價目（指／油壓 90 分 1500、120 分 2000，腳底 60 分 1000、90 分 1300，刮痧／拔罐／耳燭 500，加時每 30 分 500）；師傅每支 300（120 分＝1200）、老點多 100；關掉範例的平日限定與五六日活動；沒賣的組合價目表顯示「—」；LINE 內建瀏覽器開啟時不呼叫登入，改用 liff.line.me 重新開（店長手機實測的問題）。"]];function Changelo
